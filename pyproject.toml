# 项目级工具配置。当前仅承载 ruff（Python lint 基线门禁，第三期任务 0.2）。
# 基线策略：只启用 pyflakes + 语法级错误（E4/E7/E9/F），拦截真实缺陷
# （未定义名称 F821、未使用变量/导入、重复定义），不引入风格类噪音。
# 历史风格问题（UP/BLE/S/RUF 等 500+ 处）不在本期门禁范围，后续按域渐进收敛。
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "_archive_legacy",
    "htmlcov",
    ".venv",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# pytest 配置：注册 perf 标记（第三期任务 0.2）
# 百万行性能验收依赖本地/专用验收机的时间基线，共享 CI runner 上天然不稳定，
# 不作为 CI 硬门禁；CI 用 `-m "not perf"` 排除，本地验收仍跑
# `pytest tests/performance -m perf`。
[tool.pytest.ini_options]
markers = [
    "perf: 百万级数据性能验收（时间敏感，仅在受控环境运行）",
]
