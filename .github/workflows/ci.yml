name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# 最小权限：仅读代码（此前诊断期临时授予的 issues:write 已随诊断步移除）
permissions:
  contents: read

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ruff
        run: python -m pip install --upgrade pip && pip install ruff
      # 基线门禁（第三期任务 0.2）：pyflakes + 语法级错误（E4/E7/E9/F），
      # 拦截未定义名称/未使用导入/重复定义等真实缺陷；规则集见根目录 pyproject.toml。
      - name: Ruff lint
        run: ruff check edge/ tests/

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 与 requirements.lock.txt 生成环境（3.13）及本地 venv 对齐：
          # numpy 2.5 等锁定版本 requires-python >=3.12，3.11 无法安装（v2.0.0 CI 实证）。
          python-version: '3.13'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('edge/requirements.lock.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r edge/requirements.lock.txt pytest httpx pytest-cov
      - name: Run backend tests (coverage gate >= 75%)
        # network_scan 依赖真实局域网摄像头；perf（test_perf_1m）为时间敏感的
        # 百万行性能验收，在共享 runner 上断言不可靠（2026-08-18 起 CI 红灯根因），
        # 二者均排除，本地/验收机专项运行。test_video_stream 已 mock 化恢复纳入。
        # soak_guard 自测（秒级、无硬件依赖）保留在门禁内。
        # 覆盖率门禁基线 75%（本地实测 81%，为环境波动留余量）。
        run: pytest tests/ -p no:logging -q -m "not perf" -k "not network_scan" --cov=edge/src --cov-report=term-missing --cov-fail-under=75

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install (locked) & verify
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run test:unit
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f Dockerfile.backend -t aibc-backend:ci .
      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t aibc-frontend:ci .
