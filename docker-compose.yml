version: '3.8'

services:
  # 后端服务（FastAPI + SQLite，无外部依赖）
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aibc-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 数据库、配置、模型权重的持久化（与代码 MODEL_DIR=/app/model 对齐，单数 model）
      - ./edge/data:/app/data
      - ./edge/config:/app/config
      - ./edge/model:/app/model
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      # 容器内路径覆盖（H6）：数据落持久化卷、模型指向内置权重
      - AIQC_DB_PATH=/app/data/inspection.db
      - AIQC_MODEL_PATH=/app/model/yolov8n.pt
      # 生产务必覆盖（可在宿主机 .env 中设置后通过 ${VAR} 注入；留空则沿用配置默认值）
      - AIQC_SECRET_KEY=${AIQC_SECRET_KEY:-}
      - AIQC_ADMIN_PASSWORD=${AIQC_ADMIN_PASSWORD:-}
    networks:
      - aibc-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 前端服务（Nginx 静态 + 反向代理）
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aibc-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - aibc-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  aibc-network:
    driver: bridge
